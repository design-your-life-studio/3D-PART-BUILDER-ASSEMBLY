        // ================= 自動暫存 / 未儲存提醒 =================
        let isDirty = false;
        let isResetting = false;
        let autosaveTimer = null;

        function markDirty() {
            isDirty = true;
            const el = document.getElementById('dirty-indicator');
            if (el) el.classList.remove('hidden');
        }
        function markClean() {
            isDirty = false;
            const el = document.getElementById('dirty-indicator');
            if (el) el.classList.add('hidden');
        }

        function idbOpen() {
            return new Promise((resolve, reject) => {
                const r = indexedDB.open('part-builder-draft', 1);
                r.onupgradeneeded = () => r.result.createObjectStore('drafts');
                r.onsuccess = () => resolve(r.result);
                r.onerror = () => reject(r.error);
            });
        }
        async function idbRun(mode, fn) {
            const db = await idbOpen();
            try {
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction('drafts', mode);
                    const req = fn(tx.objectStore('drafts'));
                    tx.oncomplete = () => resolve(req ? req.result : undefined);
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
            } finally {
                db.close();
            }
        }
        async function draftPut(data) { try { await idbRun('readwrite', st => st.put(data, 'current')); } catch (e) { console.warn('自動暫存失敗:', e); } }
        async function draftGet() { try { return await idbRun('readonly', st => st.get('current')); } catch (e) { return null; } }
        async function draftDelete() { try { await idbRun('readwrite', st => st.delete('current')); } catch (e) { /* 忽略 */ } }

        function scheduleAutosave() {
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(autosaveNow, 1500);
        }
        function autosaveNow() {
            clearTimeout(autosaveTimer);
            if (!isDirty) return;
            try { draftPut({ savedAt: Date.now(), workspace: collectWorkspace() }); } catch (e) { console.warn(e); }
        }

        function restoreWorkspaceObject(ws) {
            applyWorkspaceData(ws.parts, ws.images || {});
            groupNames = ws.groupNames || {};
            resetHistory();
            refreshObjectList();
        }

        async function checkDraftRestore() {
            const d = await draftGet();
            if (!d || !d.workspace || !d.workspace.parts || d.workspace.parts.length === 0) return;
            const time = new Date(d.savedAt).toLocaleString('zh-TW');
            showModal({
                title: '偵測到未儲存的內容',
                message: `上次自動暫存時間：${time}\n零件數量：${d.workspace.parts.length}\n要還原嗎？(影片檔不會保留，需要重新連結)`,
                okText: '還原',
                cancelText: '捨棄',
                onOk: () => { restoreWorkspaceObject(d.workspace); markDirty(); },
                onCancel: () => draftDelete()
            });
        }

        // ================= 屬性面板 (精確數值) =================
        let lastPropsSig = '';
        const PROP_SIZE_DEFS = {
            box: [['w', '寬'], ['h', '高'], ['d', '深']],
            cylinder: [['r', '半徑'], ['h', '高']],
            sphere: [['r', '半徑']],
            plane: [['w', '寬'], ['h', '高']]
        };
        const sizeKindOf = (o) => (isPlaneType(o) ? 'plane' : o.userData.type);
        const r2 = (v) => Math.round(v * 100) / 100;

        function getSizeValues(o) {
            return sizeKindOf(o) === 'plane' ? { w: o.scale.x, h: o.scale.y } : { ...(o.userData.params || {}) };
        }

        function refreshPropsPanel(force) {
            const panel = document.getElementById('props-panel');
            if (!panel) return;
            if (selectedObjects.length === 0 || visitMode || showcase) {
                panel.classList.add('hidden');
                lastPropsSig = '';
                return;
            }
            // 使用者正在輸入時，不要覆寫輸入框
            if (!force && panel.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;

            const single = selectedObjects.length === 1;
            let pos, rot = null, defs = null, vals = null, title, note = '';
            if (single) {
                const o = selectedObjects[0];
                pos = o.position;
                rot = [o.rotation.x, o.rotation.y, o.rotation.z].map(r => THREE.MathUtils.radToDeg(r));
                defs = PROP_SIZE_DEFS[sizeKindOf(o)];
                vals = getSizeValues(o);
                title = displayName(o);
            } else {
                pos = getSelectionBox().getCenter(new THREE.Vector3());
                title = `已選取 ${selectedObjects.length} 個零件`;
                note = '多選時只能修改整體位置';
            }

            const sig = JSON.stringify([single, r2(pos.x), r2(pos.y), r2(pos.z), rot && rot.map(r2), vals && Object.values(vals).map(r2), title]);
            if (!force && sig === lastPropsSig) return;
            lastPropsSig = sig;

            panel.classList.remove('hidden');
            document.getElementById('props-title').innerText = title;
            document.getElementById('props-note').innerText = note;
            const set = (k, v, dis) => {
                const el = panel.querySelector(`[data-prop="${k}"]`);
                el.value = dis ? '' : r2(v);
                el.disabled = !!dis;
            };
            set('px', pos.x); set('py', pos.y); set('pz', pos.z);
            set('rx', rot ? rot[0] : 0, !single); set('ry', rot ? rot[1] : 0, !single); set('rz', rot ? rot[2] : 0, !single);

            // 尺寸欄位依零件種類動態產生
            const box = document.getElementById('props-size');
            box.innerHTML = '';
            if (defs) {
                const cell = (txt, cls) => { const s = document.createElement('span'); s.textContent = txt; if (cls) s.className = cls; box.appendChild(s); };
                cell('');
                for (let i = 0; i < 3; i++) cell(defs[i] ? defs[i][1] : '', 'text-[10px] text-gray-500 text-center');
                cell('尺寸');
                for (let i = 0; i < 3; i++) {
                    if (!defs[i]) { cell(''); continue; }
                    const inp = document.createElement('input');
                    inp.className = 'pp-input';
                    inp.type = 'number';
                    inp.step = '1';
                    inp.min = '1';
                    inp.dataset.size = defs[i][0];
                    inp.value = r2(vals[defs[i][0]]);
                    box.appendChild(inp);
                }
            }
        }

        function applyPropEdit(key, v) {
            if (key[0] === 'p') {
                const axis = key[1];
                if (selectedObjects.length === 1) {
                    selectedObjects[0].position[axis] = v;
                } else {
                    const c = getSelectionBox().getCenter(new THREE.Vector3());
                    const d = v - c[axis];
                    selectedObjects.forEach(o => { o.position[axis] += d; });
                    positionPivot();
                }
            } else if (key[0] === 'r' && selectedObjects.length === 1) {
                selectedObjects[0].rotation[key[1]] = THREE.MathUtils.degToRad(v);
            }
            commitHistory();
            refreshPropsPanel(true);
        }

        function applySizeEdit(key, v) {
            if (selectedObjects.length !== 1) return;
            const o = selectedObjects[0];
            if (sizeKindOf(o) === 'plane') {
                const val = Math.max(2, v);
                if (key === 'w') o.scale.x = val; else o.scale.y = val;
            } else {
                applyPartParams(o, { ...(o.userData.params || {}), [key]: Math.max(1, v) });
            }
            commitHistory();
            refreshPropsPanel(true);
        }

        function onPropsChange(e) {
            const el = e.target;
            const v = parseFloat(el.value);
            if (!isFinite(v)) { refreshPropsPanel(true); return; }
            if (el.dataset.prop) applyPropEdit(el.dataset.prop, v);
            else if (el.dataset.size) applySizeEdit(el.dataset.size, v);
        }

        // ================= 物件清單 =================
        const collapsedGroups = new Set();
        let renamingActive = false;

        function membersOfGroup(gid) {
            return assembledObjects.filter(o => (o.userData.groupIds || []).includes(gid));
        }

        function buildObjectTree() {
            const root = { children: [] };
            assembledObjects.forEach(o => {
                let node = root;
                [...(o.userData.groupIds || [])].reverse().forEach(gid => { // 由外層到內層
                    let g = node.children.find(c => c.gid === gid);
                    if (!g) { g = { gid, children: [] }; node.children.push(g); }
                    node = g;
                });
                node.children.push({ obj: o });
            });
            return root;
        }

        function toggleHidden(list) {
            const hide = list.some(o => !o.userData.hidden);
            list.forEach(o => { o.userData.hidden = hide; o.visible = !hide; });
            setSelection(selectedObjects);
            commitHistory();
        }
        function toggleLocked(list) {
            const lock = list.some(o => !o.userData.locked);
            list.forEach(o => { o.userData.locked = lock; });
            setSelection(selectedObjects);
            commitHistory();
        }

        function selectFromList(list, additive) {
            const ok = list.filter(isPickable);
            if (ok.length === 0) { flashInfo('已隱藏或鎖定的物件無法選取'); return; }
            if (additive) {
                const allIn = ok.every(o => selectedObjects.includes(o));
                setSelection(allIn ? selectedObjects.filter(o => !ok.includes(o)) : [...selectedObjects, ...ok.filter(o => !selectedObjects.includes(o))]);
            } else {
                setSelection(ok);
            }
        }

        function startRename(nameEl, current, onDone) {
            renamingActive = true;
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.value = current;
            inp.className = 'pp-input';
            inp.style.flex = '1';
            nameEl.replaceWith(inp);
            inp.focus();
            inp.select();
            let done = false;
            const finish = (commit) => {
                if (done) return;
                done = true;
                renamingActive = false;
                if (commit) onDone(inp.value.trim());
                refreshObjectList();
            };
            inp.addEventListener('keydown', (e) => {
                e.stopPropagation();
                if (e.key === 'Enter') finish(true);
                else if (e.key === 'Escape') finish(false);
            });
            inp.addEventListener('blur', () => finish(true));
            inp.addEventListener('click', (e) => e.stopPropagation());
        }

        function refreshObjectList() {
            const panel = document.getElementById('object-list');
            if (!panel || panel.classList.contains('hidden') || renamingActive) return;
            const body = document.getElementById('ol-body');
            body.innerHTML = '';
            document.getElementById('ol-count').innerText = assembledObjects.length + ' 個';
            if (assembledObjects.length === 0) {
                const e = document.createElement('div');
                e.className = 'p-3 text-gray-500';
                e.textContent = '目前沒有任何物件';
                body.appendChild(e);
                return;
            }

            // 每種零件的流水號 (名稱沒有自訂時使用)
            const counters = {};
            const names = new Map();
            assembledObjects.forEach(o => {
                const t = o.userData.type;
                counters[t] = (counters[t] || 0) + 1;
                names.set(o, o.userData.name || ((TYPE_LABELS[t] || '零件') + ' ' + counters[t]));
            });

            let groupCounter = 0;
            const mkBtn = (txt, on, title, fn) => {
                const b = document.createElement('button');
                b.className = 'ol-btn' + (on ? ' on' : '');
                b.textContent = txt;
                b.title = title;
                b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
                return b;
            };

            const renderNode = (node, depth) => {
                node.children.forEach(ch => {
                    const row = document.createElement('div');
                    row.className = 'ol-row';
                    row.style.paddingLeft = (6 + depth * 14) + 'px';
                    const nameEl = document.createElement('span');
                    nameEl.className = 'ol-name';

                    if (ch.obj) {
                        const o = ch.obj;
                        if (selectedObjects.includes(o)) row.classList.add('selected');
                        if (o.userData.hidden || o.userData.locked) row.classList.add('dim');
                        const sp = document.createElement('span');
                        sp.className = 'ol-toggle';
                        row.appendChild(sp);
                        nameEl.textContent = names.get(o);
                        nameEl.addEventListener('dblclick', (e) => {
                            e.stopPropagation();
                            startRename(nameEl, names.get(o), (v) => { o.userData.name = v || undefined; commitHistory(); });
                        });
                        row.appendChild(nameEl);
                        row.appendChild(mkBtn(o.userData.hidden ? '已隱藏' : '隱藏', o.userData.hidden, '顯示 / 隱藏', () => toggleHidden([o])));
                        row.appendChild(mkBtn(o.userData.locked ? '已鎖定' : '鎖定', o.userData.locked, '鎖定後無法被選取或移動', () => toggleLocked([o])));
                        row.addEventListener('click', (e) => selectFromList([o], e.shiftKey));
                        body.appendChild(row);
                    } else {
                        const gid = ch.gid;
                        const members = membersOfGroup(gid);
                        const label = groupNames[gid] || ('群組 ' + (++groupCounter));
                        if (members.length && members.every(m => selectedObjects.includes(m))) row.classList.add('selected');
                        const collapsed = collapsedGroups.has(gid);

                        nameEl.textContent = label + ` (${members.length})`;

                        nameEl.addEventListener('dblclick', (e) => {
                            e.stopPropagation();
                            startRename(nameEl, label, (v) => { if (v) groupNames[gid] = v; else delete groupNames[gid]; commitHistory(); });
                        });
                        row.appendChild(nameEl);
                        const allHidden = members.every(m => m.userData.hidden);
                        const allLocked = members.every(m => m.userData.locked);
                        row.appendChild(mkBtn(allHidden ? '已隱藏' : '隱藏', allHidden, '顯示 / 隱藏整組', () => toggleHidden(members)));
                        row.appendChild(mkBtn(allLocked ? '已鎖定' : '鎖定', allLocked, '鎖定整組', () => toggleLocked(members)));
                        row.addEventListener('click', (e) => selectFromList(members, e.shiftKey));
                        body.appendChild(row);
                        if (!collapsed) renderNode(ch, depth + 1);
                    }
                });
            };
            renderNode(buildObjectTree(), 0);
        }

        // 物件清單視窗：可拖曳，位置會記住
        const OL_POS_KEY = 'part-builder-list-pos';

        function toggleObjectList() {

        // ================= 零件吸附 (拖曳時自動貼齊其他零件) =================
        let partSnapEnabled = true;
        let isAltDown = false;
        let snapCache = null;

        // 在已排序的陣列中找最接近 v 的值
        function nearestSorted(arr, v) {
            if (arr.length === 0) return null;
            let lo = 0, hi = arr.length;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (arr[mid] < v) lo = mid + 1; else hi = mid;
            }
            const c1 = lo > 0 ? arr[lo - 1] : null;
            const c2 = lo < arr.length ? arr[lo] : null;
            if (c1 === null) return c2;
            if (c2 === null) return c1;
            return (v - c1) <= (c2 - v) ? c1 : c2;
        }

        // 零件吸附：單一零件、多選、群組都適用。
        // 被拖曳的每一個零件(以及整體外框)的面與中心，都會去貼齊其他零件的面與中心；地面則以整體最低點對齊。
        function applyPartSnap() {
            if (!partSnapEnabled || isAltDown) return;
            const obj = transformControl.object;
            if (!obj || selectedObjects.length === 0) return;
            const axisStr = (transformControl.axis || '').toLowerCase();
            const axes = ['x', 'y', 'z'].filter(a => axisStr.includes(a));
            if (axes.length === 0) return;

            if (!snapCache) {
                // 拖曳開始後第一次計算：整理「其他零件」的所有吸附位置，以及「被拖曳零件」目前的外框
                const vals = { x: [], y: [], z: [] };
                assembledObjects.forEach(o => {
                    if (!o.visible || selectedObjects.includes(o)) return;
                    o.updateWorldMatrix(true, false);
                    const bb = new THREE.Box3().setFromObject(o);
                    if (bb.isEmpty()) return;
                    ['x', 'y', 'z'].forEach(a => vals[a].push(bb.min[a], (bb.min[a] + bb.max[a]) / 2, bb.max[a]));
                });
                ['x', 'y', 'z'].forEach(a => vals[a].sort((p, q) => p - q));
                const parts = selectedObjects.map(o => {
                    o.updateWorldMatrix(true, false);
                    return new THREE.Box3().setFromObject(o);
                });
                snapCache = { vals, parts, whole: getSelectionBox(), base: obj.position.clone() };
            }
            const sc = snapCache;
            if (sc.whole.isEmpty()) return;

            // 目前相對於快取時的位移 (拖曳是純平移，外框跟著平移即可)
            const off = obj.position.clone().sub(sc.base);

            // 吸附距離以「螢幕上約 8 像素」換算，不論縮放遠近手感一致
            const center = sc.whole.getCenter(new THREE.Vector3()).add(off);
            const dist = rightCamera.position.distanceTo(center);
            const unitsPerPx = (2 * dist * Math.tan(THREE.MathUtils.degToRad(rightCamera.fov / 2))) / Math.max(1, rightRenderer.domElement.clientHeight);
            const thr = Math.max(0.3, unitsPerPx * 8);

            const delta = new THREE.Vector3();
            axes.forEach(a => {
                let bestAbs = thr, bestDelta = null;
                const consider = (src) => {
                    const t = nearestSorted(sc.vals[a], src);
                    if (t === null) return;
                    const d = t - src;
                    if (Math.abs(d) < bestAbs) { bestAbs = Math.abs(d); bestDelta = d; }
                };
                const feed = (bb) => {
                    consider(bb.min[a] + off[a]);
                    consider((bb.min[a] + bb.max[a]) / 2 + off[a]);
                    consider(bb.max[a] + off[a]);
                };
                feed(sc.whole);
                sc.parts.forEach(feed);
                if (a === 'y') { // 貼齊地面：整體最低點
                    const d = -(sc.whole.min.y + off.y);
                    if (Math.abs(d) < bestAbs) { bestAbs = Math.abs(d); bestDelta = d; }
                }
                if (bestDelta !== null) delta[a] = bestDelta;
            });

            if (delta.lengthSq() > 0) {
                obj.position.add(delta);
                obj.updateMatrixWorld(true);
            }
        }

        // ================= 對齊、等距、鏡像、陣列 =================
        function getSelectionUnits() {
            const map = new Map();
            selectedObjects.forEach(o => {
                const k = outerGroupId(o) || o.uuid;
                if (!map.has(k)) map.set(k, []);
                map.get(k).push(o);
            });
            return [...map.values()].map(members => {
                const box = new THREE.Box3();
                members.forEach(o => { o.updateWorldMatrix(true, false); box.union(new THREE.Box3().setFromObject(o)); });
                return { members, box };
            });
        }

        function alignSelection(axis, mode) {
            if (showcase) stopShowcase(false);
            const units = getSelectionUnits();
            if (units.length < 2) { flashInfo('需要選取 2 個以上的物件(或群組)才能對齊'); return; }
            const sel = getSelectionBox();
            const pick = (b) => mode === 'min' ? b.min[axis] : mode === 'max' ? b.max[axis] : (b.min[axis] + b.max[axis]) / 2;
            const target = pick(sel);
            units.forEach(u => {
                const d = target - pick(u.box);
                if (d !== 0) u.members.forEach(o => { o.position[axis] += d; });
            });
            positionPivot();
            commitHistory();
        }

        function distributeSelection(axis) {
            if (showcase) stopShowcase(false);
            const units = getSelectionUnits();
            if (units.length < 3) { flashInfo('等距排列需要 3 個以上的物件(或群組)'); return; }
            units.sort((a, b) => (a.box.min[axis] + a.box.max[axis]) - (b.box.min[axis] + b.box.max[axis]));
            const first = units[0].box, last = units[units.length - 1].box;
            const span = last.max[axis] - first.min[axis];
            const total = units.reduce((s, u) => s + (u.box.max[axis] - u.box.min[axis]), 0);
            const gap = (span - total) / (units.length - 1);
            let cursor = first.max[axis];
            for (let i = 1; i < units.length - 1; i++) {
                const u = units[i];
                const size = u.box.max[axis] - u.box.min[axis];
                const d = (cursor + gap) - u.box.min[axis];
                u.members.forEach(o => { o.position[axis] += d; });
                cursor = cursor + gap + size;
            }
            positionPivot();
            commitHistory();
        }

        function mirrorSelection(axis) {
            if (showcase) stopShowcase(false);
            if (selectedObjects.length === 0) { alertHint(); return; }
            const M = new THREE.Matrix4().makeScale(axis === 'x' ? -1 : 1, axis === 'y' ? -1 : 1, axis === 'z' ? -1 : 1);
            const clones = duplicateSet(selectedObjects);
            let allOnPlane = true;
            clones.forEach(c => {
                if (Math.abs(c.position[axis]) > 1e-4) allOnPlane = false;
                c.position[axis] *= -1;
                const R = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
                c.quaternion.setFromRotationMatrix(M.clone().multiply(R).multiply(M));
            });
            setSelection(clones);
            commitHistory();
            if (allOnPlane) flashInfo('物件剛好在鏡像平面上，副本與原件重疊');
        }

        function openCircularArrayDialog() {
            if (selectedObjects.length === 0) { alertHint(); return; }
            showModal({
                title: '環形陣列',
                message: '以指定的軸線為中心，環繞複製選取的物件。',
                fields: [
                    { id: 'n', label: '總份數 (含原件)', value: 6, min: 2, max: 100 },
                    { id: 'axis', label: '旋轉軸', type: 'select', value: 'y', options: [{ value: 'y', label: 'Y 軸 (垂直)' }, { value: 'x', label: 'X 軸' }, { value: 'z', label: 'Z 軸' }] },
                    { id: 'angle', label: '總角度 (度)', value: 360, min: 1, max: 360 },
                    { id: 'cx', label: '軸心 X', value: 0 },

                ],
